plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    // module projects
    implementation project(":contract")
    implementation project(":domain")
    implementation project(":common-base")

    // spring boot
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // transactional
    implementation 'org.springframework:spring-tx'

    // spring cloud
    implementation 'org.springframework.cloud:spring-cloud-starter-sleuth'

    //Open API
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0"

    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.named('build') {
    dependsOn bootJar
}

tasks.processResources {
    doLast {
        // 리소스 파일을 특정 외부 경로로 복사
        def targetDir = file("$buildDir/libs/gram")
        copy {
            from("src/main/resources/gram/lottecard") // 복사할 소스 경로
            into(targetDir) // 복사할 대상 경로
        }
        println "Resources copied to: ${targetDir}"
    }
}

test {
    useJUnitPlatform()
}

ext {

 	BUILD_TIME = new Date().format("yyyy-MM-dd HH:mm:ss", TimeZone.getTimeZone("Asia/Seoul"))
 	MODULE_NAME = 'van-gateway'
}

bootJar {
    enabled = true
    archiveClassifier = ''
	doFirst{
		println "[ INFO ] ${MODULE_NAME} : Jar 빌드 시작"
		println "[ INFO ] PROJECT NAME : van-gateway"
		println "[ INFO ] BUILD TIME : ${BUILD_TIME}"
	}
	
    // bootJar 결과 산출 파일을 van-gateway.jar 로 지정하여 export 되도록 구성합니다.
    // version 에 따라 artifact 명이 달라지지 않도록 구성합니다.
    archiveFileName = "van-gateway.${archiveExtension.get()}"

    mainClass.set('api.server.ApiServerApplication')

}

jar {
    enabled = false
}


